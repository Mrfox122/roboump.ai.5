<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo Ump AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Robo Ump AI</h1>
        <p>Ask a question about NCAA or CCA baseball rules.</p>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="e.g., What is the infield fly rule?">
            <button id="askButton">Ask</button>
        </div>
        <div id="answer-container" class="answer-container">
            <p id="answer"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
