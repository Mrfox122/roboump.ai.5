<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Umpire AI Assistant</h1>
        <p>Your expert resource for baseball rules and mechanics.</p>
        <div class="input-area">
            <select id="ruleSetSelect">
                <option value="NCAA">NCAA Rules</option>
                <option value="NFHS">NFHS (High School) Rules</option>
                <option value="MLB">MLB (Pro) Rules</option>
            </select>
            <input type="text" id="questionInput" placeholder="e.g., What is the infield fly rule?">
            <button id="askButton">Ask</button>
        </div>
        <div id="answer-container" class="answer-container">
            <p id="answer"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
