<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umpire AI Assistant</title>
    <meta name="description" content="Get instant, expert answers to your baseball umpiring questions. RoboUmp AI provides precise rule interpretations and mechanics for NCAA, NFHS, and MLB rulebooks.">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Umpire AI Assistant</h1>
        <h2>Your expert resource for baseball rules and mechanics.</h2>
        <div class="input-area">
            <select id="ruleSetSelect">
                <option value="NCAA">NCAA Rules</option>
                <option value="NFHS">NFHS (High School) Rules</option>
                <option value="MLB">MLB (Pro) Rules</option>
            </select>
            <textarea id="questionInput" placeholder="e.g., What is the infield fly rule?"></textarea>
            <button id="askButton">Ask</button>
        </div>
        <div id="answer-container" class="answer-container">
            <p id="answer"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
