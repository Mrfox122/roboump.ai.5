<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - RoboUmp AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.google.com/recaptcha/api.js?render=6LchII8rAAAAABrbtifib5ALdna7P8h-PItnTsrE"></script>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>For sponsorship inquiries or feedback, please fill out the form below.</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit" id="submitButton">Send Message</button>
        </form>
        
        <div id="formStatus"></div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

<script>
    const contactForm = document.getElementById('contactForm');
    const submitButton = document.getElementById('submitButton');
    const formStatus = document.getElementById('formStatus');

    contactForm.addEventListener('submit', (event) => {
        event.preventDefault();
        
        submitButton.disabled = true;
        submitButton.textContent = 'Verifying...';
        formStatus.textContent = '';
        formStatus.className = '';

        // DEBUG: Check if the grecaptcha object exists
        if (typeof grecaptcha === 'undefined') {
            console.error("reCAPTCHA script not loaded or initialized.");
            formStatus.textContent = 'Error: reCAPTCHA script failed to load.';
            formStatus.className = 'status-error';
            submitButton.disabled = false;
            submitButton.textContent = 'Send Message';
            return;
        }
        
        console.log("reCAPTCHA object found. Calling grecaptcha.ready()...");

        grecaptcha.ready(function() {
            console.log("grecaptcha is ready. Executing...");
            grecaptcha.execute('YOUR_SITE_KEY_HERE', {action: 'submit'}).then(async function(token) {
                
                console.log("reCAPTCHA token received. Sending to function...");
                submitButton.textContent = 'Sending...';
                const formData = new FormData(contactForm);
                const data = Object.fromEntries(formData.entries());
                data.token = token;

                try {
                    const response = await fetch('/.netlify/functions/send-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data),
                    });

                    if (!response.ok) {
                        throw new Error('Server responded with an error.');
                    }

                    const result = await response.json();
                    formStatus.textContent = result.message;
                    formStatus.className = 'status-success';
                    contactForm.reset();

                } catch (error) {
                    console.error('Submission error:', error);
                    formStatus.textContent = 'Sorry, there was an error sending your message.';
                    formStatus.className = 'status-error';
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Send Message';
                }
            });
        });
    });
</script>
</body>
</html>
